---
sync_devices:
  hostname:
    commands:
      - command: "show system information"
        parser: "textfsm"
        jpath: "[*].system_name"
  serial:
    commands:
      - command: "show chassis detail"
        parser: "textfsm"
        jpath: "[*].chassis_hw_serial_number"
  device_type:
    commands:
      - command: "show system information"
        parser: "textfsm"
        jpath: "[*].system_type"
  mgmt_interface:
    commands:
      - command: "show system information"
        parser: "textfsm"
        jpath: "[*].management_ipv4_addr"
        post_processor: "{{ (obj | first).split('/')[0] }}"
  mask_length:
    commands:
      - command: "show system information"
        parser: "textfsm"
        jpath: "[*].management_ipv4_addr"
        post_processor: "{{ (obj | first).split('/')[1] }}"
        iterable_type: "int"
  platform:
    commands:
      - command: "show version"
        parser: "textfsm"
        jpath: "[*].timos_version"
        post_processor: "{{ (obj | first).split('-')[0] }}"
sync_network_data:
  serial:
    commands:
      - command: "info from running state chassis router chassis-number * hardware-data serial-number"
        parser: "textfsm"
        jpath: "[*].SERIAL_NUMBER"
        post_processor: "{{ obj[0] | tojson if obj else '\"\"' }}"
  interfaces:
    root_key: true
    commands:
      - command: "info from running state router interface * oper-state"
        parser: "textfsm"
        jpath: "[*].INTERFACE"
        post_processor: "{% set result={} %}{% for interface in obj %}{{ result.update({interface: {}}) or '' }}{% endfor %}{{ result | tojson }}"
