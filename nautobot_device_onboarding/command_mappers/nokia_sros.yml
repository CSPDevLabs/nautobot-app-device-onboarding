---
sync_devices:
  hostname:
    commands:
      - command: "info from running state router \"management\" interface \"management\" ipv4 primary"
        parser: "textfsm"
        jpath: "[*].hostname"
  serial:
    commands:
      - command: "info from running state chassis router chassis-number * hardware-data serial-number"
        parser: "textfsm"
        jpath: "[*].SERIAL_NUMBER"
        post_processor: "{{ obj[0] | tojson if obj else '\"\"' }}"
  device_type:
    commands:
      - command: "info from running state system platform"
        parser: "textfsm"
        jpath: "[*].device_type"
  mgmt_interface:
    commands:
      - command: "info from running state system oper-name"
        parser: "textfsm"
        jpath: "[*].oper_address"
        post_processor: "{{ (obj | first).split('/')[0] }}"
  mask_length:
    commands:
      - command: "info from running state system oper-name"
        parser: "textfsm"
        jpath: "[*].oper_address"
        post_processor: "{{ (obj | first).split('/')[1] }}"
        iterable_type: "int"
sync_network_data:
  serial:
    commands:
      - command: "info from running state chassis router chassis-number * hardware-data serial-number"
        parser: "textfsm"
        jpath: "[*].SERIAL_NUMBER"
        post_processor: "{{ obj[0] | tojson if obj else '\"\"' }}"
  interfaces:
    root_key: true
    commands:
      - command: "info from running state router interface * oper-state"
        parser: "textfsm"
        jpath: "[*].INTERFACE"
        post_processor: "{% set result={} %}{% for interface in obj %}{{ result.update({interface: {}}) or '' }}{% endfor %}{{ result | tojson }}"
