---
sync_devices:
  hostname:
    commands:
      - command: "info from running state system oper-name"
        parser: "textfsm"
        jpath: "[*].hostname"
        post_processor: "{{ obj[0] if obj else '' }}"
  serial:
    commands:
      - command: "info from running state chassis router chassis-number * hardware-data serial-number"
        parser: "textfsm"
        jpath: "[*].serial_number"
        post_processor: "{{ obj[0] | tojson if obj else '\"\"' }}"
  device_type:
    commands:
      - command: "info from running state system platform"
        parser: "textfsm"
        jpath: "[*].device_type"
  mgmt_interface:
    commands:
      - command: "show system information | match \"Management IPv4\""
        parser: "textfsm"
        jpath: "[*].mgmt_ip"
        post_processor: "{{ (obj | first).split('/')[0] if obj else '' }}"
  mask_length:
    commands:
      - command: "show system information | match \"Management IPv4\""
        parser: "textfsm"
        jpath: "[*].mgmt_ip"
        post_processor: "{{ (obj | first).split('/')[1] | int if obj and '/' in (obj | first) else 32 }}"
        iterable_type: "int"
sync_network_data:
  serial:
    commands:
      - command: "info from running state chassis router chassis-number * hardware-data serial-number"
        parser: "textfsm"
        jpath: "[*].serial_number"
        post_processor: "{{ obj[0] | tojson if obj else '\"\"' }}"
  interfaces:
    root_key: true
    commands:
      - command: "admin show configuration /configure router * interface * ipv4 primary"
        parser: "textfsm"
        jpath: "[*].interface"
        post_processor: "{% set result={} %}{% for interface in obj %}{{ result.update({interface: {}}) or '' }}{% endfor %}{{ result | tojson }}"

  interfaces__ip_addresses:
    commands:
      - command: "admin show configuration /configure router * interface * ipv4 primary"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].{ip_address: ip_address, prefix_length: prefix_length}"
        post_processor: |
          {%- if obj and obj[0].ip_address -%}
            [{"ip_address": "{{ obj[0].ip_address }}", "prefix_length": {{ obj[0].prefix_length | int }} }]
          {%- else -%}
            [{"ip_address": "", "prefix_length": ""}]
          {%- endif -%}
  interfaces__type:
    commands:
      - command: "admin show configuration /configure router * interface * port"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].port | [0]"
      - command: "info state port * type"
        parser: "textfsm"
        jpath: "[?port_id=='{{ obj }}'].hardware_type | [0]"
    post_processor: |
      {%- if obj -%}
        {{ obj | map_interface_type }}
      {%- else -%}
        {%- if 'system' in current_key or 'loopback' in current_key -%}
          {{ 'loopback' | map_interface_type }}
        {%- else -%}
          {{ 'virtual' | map_interface_type }}
        {%- endif -%}
      {%- endif -%}




